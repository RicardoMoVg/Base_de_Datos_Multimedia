<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | SegurosPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/login.css">
    <link rel="stylesheet" href="/topbar_global.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-left">
            <a href="login.html" class="topbar-logo">
                <h1>Seguros<span>Pro</span></h1>
            </a>
        </div>
    </header>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <div class="logo">
            <h1>Seguros<span>Pro</span></h1>
            <p>Acceso al sistema de gestión</p>
        </div>

        <div id="errorBanner" class="error-banner" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="usuario">Usuario / Correo</label>
                <input type="text" id="usuario" name="usuario" placeholder="ej. analista@segurospro.com" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    autocomplete="current-password">
            </div>

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn-primary" id="btnLogin">
                <span id="btnLoginText">Iniciar Sesión</span>
                <span class="spinner" id="btnSpinner"></span>
            </button>
        </form>

        <div class="divider">o</div>

        <div class="footer-links">
            ¿Nuevo en el equipo? <a href="registro.html">Crear cuenta</a>
        </div>
    </div>

    <script>
        // ── Helpers ──────────────────────────────────────────────────────────
        const errorBanner = document.getElementById('errorBanner');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnLoginText');
        const btnSpinner = document.getElementById('btnSpinner');

        function mostrarError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('visible');
            ['usuario', 'password'].forEach(id => {
                document.getElementById(id).classList.add('input-error');
            });
        }

        function limpiarError() {
            errorBanner.classList.remove('visible');
            ['usuario', 'password'].forEach(id => {
                document.getElementById(id).classList.remove('input-error');
            });
        }

        function setLoading(on) {
            btnLogin.disabled = on;
            btnText.textContent = on ? 'Autenticando...' : 'Iniciar Sesión';
            btnSpinner.style.display = on ? 'block' : 'none';
        }

        // ── Mapeo de dashboards por rol ───────────────────────────────────────
        const REDIRECT = {
            'Ajustador': 'dash_ajustador.html',
            'Supervisor': 'dash_supervisor.html',
            'Asegurado': 'dash_asegurado.html'
        };

        // ── Verificar si ya hay sesión activa ─────────────────────────────────
        (function checkSession() {
            const token = sessionStorage.getItem('sp_token');
            const tipo = sessionStorage.getItem('sp_tipo');
            if (token && REDIRECT[tipo]) {
                location.href = REDIRECT[tipo];
            }
        })();

        // ── Submit ────────────────────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            limpiarError();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;

            if (!usuario || !password) {
                mostrarError('Por favor completa todos los campos.');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('sp_token', data.token);
                    sessionStorage.setItem('sp_tipo', data.tipoUsuario);
                    sessionStorage.setItem('sp_nombre', data.nombreCompleto);
                    sessionStorage.setItem('sp_id', data.usuarioID);

                    const destino = REDIRECT[data.tipoUsuario];
                    if (destino) {
                        location.href = destino;
                    } else {
                        mostrarError('Rol de sistema desconocido. Contacta al administrador.');
                    }
                } else {
                    mostrarError(data.message || 'Credenciales inválidas.');
                }

            } catch (err) {
                console.error('Error iniciando sesión:', err);
                mostrarError('No se pudo conectar al servidor. Intenta de nuevo.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>

</html>
