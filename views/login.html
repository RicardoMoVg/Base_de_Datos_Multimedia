<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | SegurosPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reutilizamos el Design System (Variables) para mantener consistencia */
        :root {
            --primary-orange: #ff6b00;
            --primary-orange-hover: #e65c00;
            --black: #1a1a1a;
            --white: #ffffff;
            --bg-body: #f4f4f5;
            --border-color: #e4e4e7;
            --text-main: #27272a;
            --text-muted: #71717a;
            --input-bg: #fafafa;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fondo claro con un sutil patrón o gradiente radial para darle profundidad sin ser ruidoso */
            background: radial-gradient(circle at top right, #ffffff, var(--bg-body));
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        /* Elemento decorativo de fondo para darle un toque creativo y corporativo */
        body::before {
            content: '';
            position: absolute;
            top: -20vh;
            left: -10vw;
            width: 50vw;
            height: 50vw;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.05), transparent);
            border-radius: 50%;
            z-index: 0;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            /* Sombra suave y profesional en lugar de una sombra pesada */
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--black);
            letter-spacing: -0.02em;
        }

        .logo h1 span {
            color: var(--primary-orange);
        }

        .logo p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--black);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }

        input::placeholder {
            color: #a1a1aa;
        }

        input:focus {
            background: var(--white);
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }

        /* Enlace de olvidé contraseña */
        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: -12px;
            margin-bottom: 24px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: var(--primary-orange);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-orange);
            border: none;
            border-radius: 8px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
        }

        .btn-primary:hover {
            background-color: var(--primary-orange-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .footer-links {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary-orange);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <h1>Seguros<span>Pro</span></h1>
            <p>Acceso al sistema de gestión</p>
        </div>

        <form id="loginForm" action="consulta_siniestros.html" method="get">
            <div class="form-group">
                <label for="usuario">Usuario / Correo</label>
                <input type="text" id="usuario" name="usuario" placeholder="ej. analista@segurospro.com" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    autocomplete="current-password">
            </div>

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <div class="divider">o</div>

        <div class="footer-links">
            ¿Nuevo en el equipo? <a href="../views/registro.html">Crear cuenta</a>
        </div>
    </div>
</body>

</html>
