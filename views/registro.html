<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDM – Registro de Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            padding: 30px 16px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }

        .logo p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.93rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        select option {
            background: #302b63;
            color: #fff;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus,
        select:focus {
            border-color: #f093fb;
            box-shadow: 0 0 0 3px rgba(240, 147, 251, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .footer-links {
            text-align: center;
            margin-top: 22px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .footer-links a {
            color: #f093fb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #f5576c;
        }

        .req-hint {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
        }

        .section-title {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">✍️</div>
            <h1>BDM Sistema</h1>
            <p>Crear nueva cuenta</p>
        </div>

        <form id="registroForm" action="#" method="post" onsubmit="return handleRegistro(event)">

            <div class="section-title">Información Personal</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="nombre">Nombre(s)</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido(s)</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Pérez" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="juan@correo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+52 000 000 0000">
            </div>

            <div class="section-title">Cuenta</div>

            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="nombre_usuario" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="" disabled selected>Selecciona un rol</option>
                    <option value="ajustador">Ajustador</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="asegurado">Asegurado</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        autocomplete="new-password">
                    <p class="req-hint">Mínimo 8 caracteres</p>
                </div>
                <div class="form-group">
                    <label for="confirmar">Confirmar</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btnRegistrar">Crear Cuenta</button>
        </form>

        <div class="footer-links">
            ¿Ya tienes cuenta? <a href="../views/login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        function handleRegistro(e) {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmar').value;

            if (pwd !== confirm) {
                alert('Las contraseñas no coinciden.');
                return false;
            }
            if (pwd.length < 8) {
                alert('La contraseña debe tener al menos 8 caracteres.');
                return false;
            }

            // TODO: Enviar datos al backend para registrar al usuario
            alert('Registro exitoso. Redirigiendo al login...');
            location.href = 'login.html';
        }
    </script>
</body>

</html>
