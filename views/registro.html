<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | SegurosPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --primary-orange: #ff6b00;
            --primary-orange-hover: #e65c00;
            --black: #1a1a1a;
            --white: #ffffff;
            --bg-body: #f4f4f5;
            --border-color: #e4e4e7;
            --text-main: #27272a;
            --text-muted: #71717a;
            --input-bg: #fafafa;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            /* Fondo consistente con la pantalla de Login */
            background: radial-gradient(circle at top right, #ffffff, var(--bg-body));
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        /* Detalle visual de fondo */
        body::before {
            content: '';
            position: absolute;
            top: -20vh;
            left: -10vw;
            width: 50vw;
            height: 50vw;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.05), transparent);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Tarjeta de Registro */
        .register-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--black);
            letter-spacing: -0.02em;
        }

        .logo h1 span {
            color: var(--primary-orange);
        }

        .logo p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Títulos de Sección */
        .section-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 32px 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* Sistema de Grid para Formularios */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 500px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--black);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }

        input::placeholder {
            color: #a1a1aa;
        }

        input:focus,
        select:focus {
            background: var(--white);
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }

        /* Ajuste especial para el input type="file" */
        input[type="file"] {
            padding: 9px 12px;
            background: var(--white);
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Estilizar el botón "Elegir archivo" nativo */
        input[type="file"]::file-selector-button {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            margin-right: 12px;
            color: var(--black);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #e4e4e7;
        }

        .req-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Botón Principal */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-orange);
            border: none;
            border-radius: 8px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
            margin-top: 12px;
        }

        .btn-primary:hover {
            background-color: var(--primary-orange-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Enlaces del Footer */
        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary-orange);
        }
    </style>
</head>

<body>
    <div class="register-card">
        <div class="logo">
            <h1>Seguros<span>Pro</span></h1>
            <p>Crear una nueva cuenta</p>
        </div>

        <form id="registroForm" action="#" method="post" onsubmit="return handleRegistro(event)">

            <div class="section-title">Información Personal</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="nombre">Nombre(s)</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido(s)</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej. Pérez" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>
                <div class="form-group">
                    <label for="genero">Género</label>
                    <select id="genero" name="genero" required>
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="foto">Foto de Perfil</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos">
                </div>
            </div>

            <div class="section-title">Datos de Acceso</div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="alias">Alias (Usuario)</label>
                    <input type="text" id="alias" name="alias" placeholder="Ej. jperez88" required
                        autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="rol">Rol en el sistema</label>
                    <select id="rol" name="rol" required>
                        <option value="" disabled selected>Selecciona un rol...</option>
                        <option value="ajustador">Ajustador</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="asegurado">Asegurado (Cliente)</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmar">Confirmar Contraseña</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>
            </div>
            <p class="req-hint">Mínimo 8 caracteres. Debe incluir mayúscula, minúscula, número y símbolo especial.</p>

            <button type="submit" class="btn-primary">Registrar Cuenta</button>
        </form>

        <div class="footer-links">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        function handleRegistro(e) {
            e.preventDefault();

            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmar').value;

            // Validación de Contraseñas
            if (pwd !== confirm) {
                alert('⚠️ Las contraseñas no coinciden. Por favor, verifica.');
                return false;
            }

            // Validación de Edad (Mayor de 18 años)
            const dob = document.getElementById('fecha_nacimiento').value;
            if (dob) {
                const birthDate = new Date(dob);
                const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();

                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }

                if (age < 18) {
                    alert('⚠️ Debes ser mayor de 18 años para registrarte en el sistema.');
                    return false;
                }
            }

            // Validación de Fuerza de Contraseña mediante Regex
            const pwdRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
            if (!pwdRegex.test(pwd)) {
                alert('⚠️ La contraseña es muy débil. Asegúrate de cumplir con los requisitos mencionados.');
                return false;
            }

            // Si pasa todas las validaciones
            alert('✅ Registro exitoso. Redirigiendo al inicio de sesión...');
            location.href = 'login.html';
        }
    </script>
</body>

</html>
